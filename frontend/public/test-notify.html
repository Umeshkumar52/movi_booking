<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Notification Test</title>
</head>
<body>
  <h1>Firebase Push Notification Tester</h1>
  <button id="requestBtn">Request Permission & Get Token</button>
  <pre id="log" style="background:#222;color:#0f0;padding:10px;height:300px;overflow:auto;"></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuL12lKlFZnDLWYhROG0jE7DDZSpRxKSA",
      authDomain: "movibooking.firebaseapp.com",
      projectId: "movibooking",
      storageBucket: "movibooking.firebasestorage.app",
      messagingSenderId: "193904085713",
      appId: "1:193904085713:web:e18f8bb913357f049353f0"
    };

    function log(msg) {
      document.getElementById('log').innerHTML += msg + '\n';
      console.log(msg);
    }

    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    document.getElementById('requestBtn').addEventListener('click', async () => {
      try {
        log("Requesting permission...");
        const permission = await Notification.requestPermission();
        log("Permission result: " + permission);

        if (permission === "granted") {
          log("Registering Service Worker...");
          const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
          log("Service Worker registered. Fetching Token...");
          
          const token = await getToken(messaging, {
            vapidKey: "BFaliRr_-LY1eslesF8JTTJT78z9s6190p8FBaCFZFkPIQXEfU8Q73L2kkP5Y-dZ77Q6QrTHZzb8gT4RG4nzYtE",
            serviceWorkerRegistration: registration
          });
          
          log("Token Generated: " + token);
        }
      } catch (err) {
        log("Error: " + err.message);
      }
    });
  </script>
</body>
</html>
